    { id: 'w11', title: '将大连和惠州案例整理并与所有安全中台沟通商家风险信息上报问题，个体极端和维稳相关信息需及时上报渠道、同步110或应急做信息研判 @杨启皎', desc: '蔡敏/6.15属地周会', priority: 'high', status: 'doing', person: '杨启皎', deadline: '', conclusion: '', created: '2026-06-15T10:40:00.000Z' },
  ];
}

async function loadData() {
  if (USE_SUPABASE && supabaseClient) {
    try {
      const { data: rows, error } = await supabaseClient.from('todos').select('*');
      if (error) throw error;
      if (rows && rows.length > 0) {
        data = rows;
        isSharedMode = true;
        render();
        return;
      }
    } catch (e) {
      console.warn('Supabase 加载失败，降级到 localStorage', e);
    }
  }
  // localStorage fallback
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : getDefaultData();
  } catch { data = getDefaultData(); }
  data = data.filter(c => c && c.title && c.id);
  isSharedMode = false;
  render();
}

async function saveData() {
  if (isSharedMode && supabaseClient) {
    try {
      const { error } = await supabaseClient.from('todos').upsert(data, { onConflict: 'id' });
      if (error) throw error;
    } catch (e) {
      console.error('Supabase 保存失败', e);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  } else {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
}

async function upsertCard(card) {
  if (isSharedMode && supabaseClient) {
    try {
      card.updated_at = new Date().toISOString();
      const { error } = await supabaseClient.from('todos').upsert(card, { onConflict: 'id' });
      if (error) throw error;
    } catch (e) {
      console.error('Supabase 保存卡片失败', e);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  } else {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
}

async function deleteCardFromDB(id) {
  if (isSharedMode && supabaseClient) {
    try {
      const { error } = await supabaseClient.from('todos').delete().eq('id', id);
      if (error) throw error;
    } catch (e) {
      console.error('Supabase 删除失败', e);
    }
  }
}

function subscribeRealtime() {
  if (!USE_SUPABASE || !supabaseClient) return;
  supabaseClient
    .channel('todos-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => { loadData(); })
    .subscribe();
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

// Week utilities
function getWeekStart(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(date.setDate(diff));
  monday.setHours(0,0,0,0);
  return monday;
}

function isCurrentWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  return getWeekStart(d).getTime() === getWeekStart(now).getTime();
}

function isLastWeek(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  const thisWeekStart = getWeekStart(now);
  const lastWeekStart = new Date(thisWeekStart);
  lastWeekStart.setDate(lastWeekStart.getDate() - 7);
  const lastWeekEnd = new Date(thisWeekStart);
  lastWeekEnd.setDate(lastWeekEnd.getDate() - 1);
  return d >= lastWeekStart && d <= lastWeekEnd;
}

function isNewTodo(dateStr) {
  return isCurrentWeek(dateStr) || isLastWeek(dateStr);
}

function isOverdue(deadline, status) {
  if (!deadline || status === 'done') return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(deadline);
  d.setHours(0,0,0,0);
  return d < today;
}

function isDueSoon(deadline, status) {
  if (!deadline || status === 'done') return false;
  const today = new Date();
  today.setHours(0,0,0,0);
  const d = new Date(deadline);
  d.setHours(0,0,0,0);
  const diff = Math.ceil((d - today) / (1000*60*60*24));
  return diff >= 0 && diff <= 2;
}

function formatDeadline(dl) {
  if (!dl) return '';
  const d = new Date(dl + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const d2 = new Date(dl + 'T00:00:00');
  const diff = Math.ceil((d2 - today) / (1000*60*60*24));
  if (diff === 0) return '📅 今天截止';
  if (diff === 1) return '📅 明天截止';
  if (diff === -1) return '📅 昨天截止';
  return `📅 ${d.getMonth()+1}/${d.getDate()}`;
}

function getPerson(card) {
  if (card.person) return card.person;
  if (!card.title) return '';
  const m = card.title.match(/@(杜凯|王若蒙|杨启皎|蔡敏)/);
  return m ? m[1] : '';
}

function getStatusLabel(s) {
  const m = { todo: '待办', doing: '进行中', done: '已完成' };
  return m[s] || '待办';
}
function getPriorityLabel(p) {
  const m = { high: '高', medium: '中', low: '低' };
  return m[p] || '中';
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

async function toggleArchive(id) {
  const card = data.find(c => c.id === id);
  if (!card) return;
  card.archived = !card.archived;
  await upsertCard(card);
  render();
}

function createCardEl(card, isArchive) {
  const el = document.createElement('div');
  el.className = `card priority-${card.priority || 'medium'}`;
  const ov = isOverdue(card.deadline, card.status);
  if (ov) el.classList.add('overdue');
  if (card.status === 'done') el.classList.add('done');
  el.onclick = () => openModal(card);

  const person = getPerson(card);
  const conclusion = card.conclusion || '';
  const dl = formatDeadline(card.deadline);
  const ovTag = isOverdue(card.deadline, card.status);
  const soonTag = !ovTag && isDueSoon(card.deadline, card.status);

  let metaHtml = `<span class="tag tag-${card.priority || 'medium'}">${getPriorityLabel(card.priority)}</span>`;
  metaHtml += `<span class="tag tag-${card.status || 'todo'}">${getStatusLabel(card.status)}</span>`;
  if (ovTag) metaHtml += `<span class="tag tag-overdue">⚠️ 已逾期</span>`;
  else if (soonTag && dl) metaHtml += `<span class="tag tag-soon">⏰ ${dl.replace('📅 ','')}</span>`;
  else if (dl) metaHtml += `<span style="font-size:11px;color:#6b7280">${dl}</span>`;
  if (person) {
    const pMap = { '杜凯':'dukai','王若蒙':'ruomeng','杨启皎':'yangqijiao','蔡敏':'caimin' };
    const lMap = { '杜凯':'@杜凯','王若蒙':'@若蒙','杨启皎':'@杨启皎','蔡敏':'@蔡敏' };
    const pClass = pMap[person] || 'other';
    const pLabel = lMap[person] || person;
    metaHtml += `<span class="tag person-${pClass}">${pLabel}</span>`;
  }

  const actionsHtml = isArchive
    ? `<button onclick="event.stopPropagation();toggleArchive('${card.id}')" title="移回待办跟进">↩️</button><button class="del" onclick="event.stopPropagation();deleteCard('${card.id}')" title="删除">🗑</button>`
    : `<button onclick="event.stopPropagation();openModal(data.find(c=>c.id==='${card.id}'))" title="编辑">✏️</button>`
      + `<button onclick="event.stopPropagation();toggleArchive('${card.id}')" title="归档">📦</button>`
      + `<button class="del" onclick="event.stopPropagation();deleteCard('${card.id}')" title="删除">🗑</button>`;

  el.innerHTML = `
    <div class="card-title">${escapeHtml(card.title)}</div>
    ${card.desc ? `<div class="card-desc">${escapeHtml(card.desc).substring(0,60)}${card.desc.length > 60 ? '…' : ''}</div>` : ''}
    ${conclusion ? `<div style="font-size:12px;color:#059669;background:#ecfdf5;padding:4px 6px;border-radius:4px;margin-top:4px">✅ ${escapeHtml(conclusion).substring(0,50)}</div>` : ''}
    <div class="card-meta">${metaHtml}</div>
    <div class="card-actions">${actionsHtml}</div>
  `;
  return el;
}

function setPersonFilter(person) {
  personFilter = person;
  document.querySelectorAll('.person-filter .btn').forEach(b => {
    b.classList.toggle('active-person', b.dataset.person === person);
  });
  render();
}

function toggleOverdue() {
  showOverdueOnly = !showOverdueOnly;
  document.getElementById('overdueBtn').style.cssText = showOverdueOnly
    ? 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #ef4444;background:#fef2f2;color:#dc2626;cursor:pointer;font-weight:600;transition:all 0.2s'
    : 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #d1d5db;background:transparent;color:#6b7280;cursor:pointer;font-weight:500;transition:all 0.2s';
  render();
}

function toggleIncomplete() {
  showIncompleteOnly = !showIncompleteOnly;
  if (showIncompleteOnly) showDoneOnly = false;
  document.getElementById('incompleteBtn').style.cssText = showIncompleteOnly
    ? 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #2563eb;background:#eff6ff;color:#2563eb;cursor:pointer;font-weight:600;transition:all 0.2s'
    : 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #d1d5db;background:transparent;color:#6b7280;cursor:pointer;font-weight:500;transition:all 0.2s';
  document.getElementById('doneBtn').style.cssText = showDoneOnly
    ? 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #059669;background:#ecfdf5;color:#059669;cursor:pointer;font-weight:600;transition:all 0.2s'
    : 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #d1d5db;background:transparent;color:#6b7280;cursor:pointer;font-weight:500;transition:all 0.2s';
  render();
}

function toggleDone() {
  showDoneOnly = !showDoneOnly;
  if (showDoneOnly) showIncompleteOnly = false;
  document.getElementById('doneBtn').style.cssText = showDoneOnly
    ? 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #059669;background:#ecfdf5;color:#059669;cursor:pointer;font-weight:600;transition:all 0.2s'
    : 'font-size:12px;padding:4px 12px;border-radius:20px;border:1.5px solid #d1d5db;background:transparent;color:#6b7280;cursor:pointer;font-weight:500;transition:all 0.2s';
  render();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  render();
}

function renderArchive() {
  const board = document.getElementById('board');
  const stats = document.getElementById('statsRow');
  stats.style.display = 'none';
  
  const archived = data.filter(c => c.archived);
  
  board.innerHTML = '';
  const module = document.createElement('div');
  module.className = 'module history-module';
  module.style.flex = '1';
  module.innerHTML = `
    <div class="module-header">
      <span>📦 归档 &nbsp;<span style="font-size:12px;color:#9ca3af;font-weight:400">已完成的历史待办</span></span>
      <span class="count">${archived.length}</span>
    </div>
    <div class="module-body" id="archiveBody"></div>
  `;
  board.appendChild(module);
  
  const body = document.getElementById('archiveBody');
  if (archived.length === 0) {
    body.innerHTML = '<div class="empty">暂无归档记录</div>';
    return;
  }
  
  archived.sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  archived.forEach(card => {
    body.appendChild(createCardEl(card, true));
  });
}

function renderStats(filtered) {
  const total = filtered.length;
  const newCnt = filtered.filter(c => isNewTodo(c.created)).length;
  const doingCnt = filtered.filter(c => c.status === 'doing').length;
  const doneCnt = filtered.filter(c => c.status === 'done').length;
  const overdueCnt = filtered.filter(c => isOverdue(c.deadline, c.status)).length;
  const el = document.getElementById('statsRow');
  if (!el) return;
  el.innerHTML = `
    <div class="stat-card stat-total"><div class="stat-num">${total}</div><div class="stat-label">📋 总待办</div></div>
    <div class="stat-card stat-new"><div class="stat-num">${newCnt}</div><div class="stat-label">✨ 本周+上周新增</div></div>
    <div class="stat-card stat-doing"><div class="stat-num">${doingCnt}</div><div class="stat-label">🔄 进行中</div></div>
    <div class="stat-card stat-overdue"><div class="stat-num"${overdueCnt > 0 ? ' style="color:#ef4444"' : ''}>${overdueCnt}</div><div class="stat-label">⏰ 已逾期</div></div>
    <div class="stat-card stat-done"><div class="stat-num">${doneCnt}</div><div class="stat-label">✅ 已完成</div></div>
  `;
}

function appendGrouped(container, items) {
  if (items.length === 0) {
    container.innerHTML = '<div class="empty">暂无待办</div>';
    return;
  }
  
  const groups = [
    { key: 'todo', items: [], icon: '📝', label: '待办', css: 'sub-todo' },
    { key: 'doing_ok', items: [], icon: '🔄', label: '进行中（未逾期）', css: 'sub-doing' },
    { key: 'doing_ov', items: [], icon: '⏰', label: '进行中（已逾期）', css: 'sub-overdue' },
    { key: 'done', items: [], icon: '✅', label: '已完成', css: 'sub-done' },
  ];
  
  items.forEach(card => {
    if (card.status === 'done') {
      groups[3].items.push(card);
    } else if (card.status === 'doing' && isOverdue(card.deadline, card.status)) {
      groups[2].items.push(card);
    } else if (card.status === 'doing') {
      groups[1].items.push(card);
    } else {
      groups[0].items.push(card);
    }
  });
  
  container.innerHTML = '';
  groups.forEach(g => {
    if (g.items.length === 0) return;
    const hdr = document.createElement('div');
    hdr.className = `sub-hdr ${g.css}`;
    hdr.innerHTML = `${g.icon} ${g.label}<span class="sub-count">${g.items.length}</span>`;
    container.appendChild(hdr);
    g.items.forEach(card => container.appendChild(createCardEl(card)));
  });
  
  if (container.children.length === 0) {
    container.innerHTML = '<div class="empty">暂无待办</div>';
  }
}

function render() {
  const board = document.getElementById('board');
  const stats = document.getElementById('statsRow');
  board.innerHTML = '';
  
  // Archive tab
  if (currentTab === 'archive') {
    stats.style.display = 'none';
    renderArchive();
    editingId = null;
    return;
  }
  
  stats.style.display = 'flex';
  
  // Followup tab - exclude archived items
  let filtered = personFilter === 'all'
    ? data.filter(c => !c.archived) : data.filter(c => getPerson(c) === personFilter && !c.archived);
  
  if (showOverdueOnly) {
    filtered = filtered.filter(c => isOverdue(c.deadline, c.status));
  }
  if (showIncompleteOnly) {
    filtered = filtered.filter(c => c.status !== 'done');
  }
  if (showDoneOnly) {
    filtered = filtered.filter(c => c.status === 'done');
  }

  const newItems = filtered.filter(c => isNewTodo(c.created));
  const historyItems = filtered.filter(c => !isNewTodo(c.created));
  
  renderStats(filtered);

  board.innerHTML = `
    <div class="module history-module">
      <div class="module-header">
        <span>📦 历史待办</span>
        <span class="count">${historyItems.length}</span>
      </div>
      <div class="module-body" id="moduleHistory"></div>
    </div>
    <div class="module new-module">
      <div class="module-header">
        <span>✨ 新增待办 <span style="font-size:12px;color:#9ca3af;font-weight:400">（本周+上周）</span></span>
        <span class="count">${newItems.length}</span>
      </div>
      <div class="module-body" id="moduleNew"></div>
    </div>
  `;

  const bodyNew = document.getElementById('moduleNew');
  const bodyHist = document.getElementById('moduleHistory');

  appendGrouped(bodyNew, newItems);
  appendGrouped(bodyHist, historyItems);

  editingId = null;
}

// Modal
function openModal(card) {
  const modal = document.getElementById('modal');
  modal.classList.add('active');
  if (card) {
    document.getElementById('modalTitle').textContent = '编辑待办';
    document.getElementById('inputTitle').value = card.title;
    document.getElementById('inputDesc').value = card.desc || '';
    document.getElementById('inputPriority').value = card.priority || 'medium';
    document.getElementById('inputStatus').value = card.status || 'todo';
    document.getElementById('inputPerson').value = card.person || '';
    document.getElementById('inputDeadline').value = card.deadline || '';
    document.getElementById('inputConclusion').value = card.conclusion || '';
    editingId = card.id;
  } else {
    document.getElementById('modalTitle').textContent = '新建待办';
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputDesc').value = '';
    document.getElementById('inputPriority').value = 'medium';
    document.getElementById('inputStatus').value = 'todo';
    document.getElementById('inputPerson').value = getCurrentUser() || '';
    document.getElementById('inputDeadline').value = '';
    document.getElementById('inputConclusion').value = '';
    editingId = null;
  }
  document.getElementById('inputTitle').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  editingId = null;
}

async function saveCard() {
  const title = document.getElementById('inputTitle').value.trim();
  if (!title) { alert('请输入标题'); return; }
  const desc = document.getElementById('inputDesc').value.trim();
  const priority = document.getElementById('inputPriority').value;
  const status = document.getElementById('inputStatus').value;
  const person = document.getElementById('inputPerson').value;
  const deadline = document.getElementById('inputDeadline').value;
  const conclusion = document.getElementById('inputConclusion').value.trim();

  if (editingId) {
    const idx = data.findIndex(c => c.id === editingId);
    if (idx >= 0) {
      const oldStatus = data[idx].status;
      data[idx] = { ...data[idx], title, desc, priority, status, person, deadline, conclusion };
      if (status === 'done' && oldStatus !== 'done' && !isNewTodo(data[idx].created)) {
        data[idx].archived = true;
      }
      await upsertCard(data[idx]);
    }
  } else {
    const newCard = { id: genId(), title, desc, priority, status, person: person || getCurrentUser() || '', deadline, conclusion, archived: false, created: new Date().toISOString() };
    data.push(newCard);
    await upsertCard(newCard);
  }
  closeModal();
  await loadData();
}

async function deleteCard(id) {
  if (!confirm('确定删除这条待办？')) return;
  data = data.filter(c => c.id !== id);
  await deleteCardFromDB(id);
  render();
}

function recordConclusion(id) {
  const card = data.find(c => c.id === id);
  if (!card) return;
  const current = card.conclusion || '';
  const result = prompt('记录结论：', current);
  if (result === null) return;
  card.conclusion = result;
  saveData();
  render();
}

async function importWeekData() {
  const newTodos = getDefaultData().filter(d => d.id.startsWith('w'));
  const existingIds = new Set(data.map(d => d.id));
  let added = 0;
  for (const t of newTodos) {
    if (!existingIds.has(t.id)) {
      data.push(t);
      await upsertCard(t);
      added++;
    }
  }
  if (added === 0) { alert('历史待办已导入，没有新增数据'); return; }
  render();
  alert(`✅ 已导入 ${added} 条6.15周会历史待办`);
}

async function clearAll() {
  if (!confirm('确定清空所有待办？此操作不可恢复！')) return;
  const ids = data.map(c => c.id);
  data = [];
  for (const id of ids) {
    await deleteCardFromDB(id);
  }
  render();
}

// Init
if (USE_SUPABASE && typeof supabase !== 'undefined') {
  const { createClient } = supabase;
  supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

(async function() {
  await loadData();
  subscribeRealtime();
  render();
})();

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modal').classList.contains('active') && e.target.tagName !== 'TEXTAREA') saveCard();
});
